<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header class="hero">
    <div class="hero-banner" aria-hidden="true"></div>
    <div class="hero-avatar" aria-hidden="true"></div>
    <h1 id="nome"></h1>
    <nav class="redes" id="redes" aria-label="Redes sociais"></nav>
  </header>
  <div id="secoes"></div>
</main>
<script src="js/config.js"></script>
<script>
const P = window.PERFIL, $ = s => document.querySelector(s);
const root = document.documentElement;
const asset = path => new URL(path, document.baseURI).href;
const layouts = ["classic", "hero", "banner"];
const layout = layouts.includes(P.layout) ? P.layout : "hero";
const exibicao = P.exibicao === "carousel" ? "carousel" : "grid";
const grupos = P.grupos || [{ titulo: "Meus negócios", secoes: P.secoes || [] }];
root.dataset.layout = layout;
root.dataset.exibicao = exibicao;
const eixo = (nome, validos, padrao) => {
  const v = new URLSearchParams(location.search).get(nome) || P[nome];
  root.dataset[nome] = validos.includes(v) ? v : padrao;
};
eixo("icones", ["traco", "preenchido", "bolha"], "traco");
eixo("cards", ["vidro", "solido", "contorno", "lista"], "vidro");
eixo("hover", ["fundo", "salto", "brilho", "balanco"], "salto");
eixo("fundo", ["foto-blur", "gradiente", "solido"], "foto-blur");
const estilo = root.dataset.icones;
root.dataset.icones = estilo;
root.dataset.tema = new URLSearchParams(location.search).get("tema") || P.tema;
root.style.setProperty("--foto", `url("${asset(P.foto)}")`);
root.style.setProperty("--banner", `url("${asset(P.banner || P.foto)}")`);
document.title = P.nome;

const ic = r => `<a class="ic" href="${r.url}" target="_blank" rel="noopener noreferrer" aria-label="${r.tipo}"><span class="ico" style="--ico:url('${asset(`assets/icons/${estilo}/${r.tipo}.svg`)}')"></span></a>`;

$("#nome").textContent = P.nome;
$("#redes").innerHTML = P.redes.map(ic).join("");
const renderSecao = s => `
  <article class="secao">
    <div class="capa" style="--img:url('${asset(s.imagem)}')"></div>
    <div class="info"><h3>${s.titulo}</h3><div class="redes">${s.redes.map(ic).join("")}</div></div>
    ${s.texto ? `<p>${s.texto}</p>` : ""}
  </article>`;

$("#secoes").innerHTML = grupos.map(g => `
  <section class="grupo">
    <h2>${g.titulo}</h2>
    <div class="secoes">${g.secoes.map(renderSecao).join("")}</div>
  </section>`).join("");
</script>
</body>
</html>
