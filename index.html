<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dhampirkid</title>
<meta name="description" content="Meus links.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Marcellus&family=Oxanium:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header class="hero">
    <h1 id="nome"></h1>
    <nav class="redes" id="redes" aria-label="Redes sociais"></nav>
  </header>
  <div id="secoes"></div>
</main>
<script src="js/config.js"></script>
<script>
const P = window.PERFIL, $ = s => document.querySelector(s);
const root = document.documentElement;
const asset = path => new URL(path, document.baseURI).href;
root.dataset.tema = new URLSearchParams(location.search).get("tema") || P.tema;
root.style.setProperty("--foto", `url("${asset(P.foto)}")`);
document.title = P.nome;

const I = {
  instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/>',
  whatsapp: '<path d="M3 21l1.6-4.6A8.5 8.5 0 1 1 8 19.5z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/>',
  tiktok: '<path d="M15 3v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M15 3c.3 2.2 1.8 3.8 4 4"/>',
  link: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/>'
};
const ic = r => `<a class="ic" href="${r.url}" target="_blank" rel="noopener noreferrer" aria-label="${r.tipo}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[r.tipo] || I.link}</svg></a>`;

$("#nome").textContent = P.nome;
$("#redes").innerHTML = P.redes.map(ic).join("");
$("#secoes").innerHTML = P.secoes.map(s => `
  <section class="secao">
    <div class="capa" style="--img:url('${asset(s.imagem)}')"></div>
    <div class="info"><h2>${s.titulo}</h2><div class="redes">${s.redes.map(ic).join("")}</div></div>
    ${s.texto ? `<p>${s.texto}</p>` : ""}
  </section>`).join("");
</script>
</body>
</html>
